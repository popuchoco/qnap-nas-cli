name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Match CI's supported Python range and Ubuntu runner.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q qnap_nas_cli
      - run: python -m qnap_nas_cli --help

  build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build --sdist --wheel --outdir dist/
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/qnap-nas-cli
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Verify tag and prepare changelog notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          with Path("pyproject.toml").open("rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]
          if tag != "v" + version:
              raise SystemExit("release tag {} does not match project version {}".format(tag, version))

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"(?ms)^##\s+" + re.escape(version) + r"(?:\s|$)(.*?)(?=^##\s+|\Z)", changelog)
          if not match:
              raise SystemExit("CHANGELOG.md has no section for {}".format(version))
          Path("release-notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Create GitHub Release with distributions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
