name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Python 3.8 is intentionally supported for older NAS environments.
    # Ubuntu 26 runners no longer provide it through setup-python.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q qnap_nas_cli
      - run: python -m qnap_nas_cli --help
      - run: python -m pip wheel . --no-deps -w dist
